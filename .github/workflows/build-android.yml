name: CI (android)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'sdm670-static'
        type: choice
        options:
          - sdm670-static
          - sdm670-static-minimal
      version_tag:
        description: 'Version tag for artifacts'
        required: false
        default: ''
        type: string

jobs:
  sdm670-static:
    name: SDM670 Static (ARMv8.0 baseline, NO dotprod/i8mm/fp16-arith)
    if: github.event.inputs.build_type == 'sdm670-static' || github.event.inputs.build_type == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          submodules: recursive

      - name: Install Android SDK + NDK (manual, avoids broken 'tools' package)
        run: |
          # Install SDK command line tools
          SDK_VERSION=11076708
          ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${SDK_VERSION}_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # Accept licenses
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # Install platform, build-tools, NDK
          sdkmanager "platforms;android-30" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Configure CMake (ARMv8.0 baseline - SAFE for Cortex-A75)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU_AARCH64=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_KLEIDIAI=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8-a -fno-vectorize -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a -fno-vectorize -O3"

      - name: Build (static)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cmake --build build-android --config Release --target llama-cli llama-bench -j$(nproc)

      - name: Verify no illegal instructions (objdump)
        run: |
          apt-get update -qq && apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null
          echo "=== Checking for SDOT/UDOT (need asimddp) ==="
          aarch64-linux-gnu-objdump -d build-android/bin/llama-cli | grep -cE '\b(sdot|udot|sdotp|udotp)\b' && { echo "FAIL: dotprod instructions found"; exit 1; } || echo "PASS: no dotprod"
          echo "=== Checking for SMMLA/UMMLA (need i8mm) ==="
          aarch64-linux-gnu-objdump -d build-android/bin/llama-cli | grep -cE '\b(smmla|ummla|usmmla|smmlal|usmmlal)\b' && { echo "FAIL: i8mm instructions found"; exit 1; } || echo "PASS: no i8mm"
          echo "=== Checking for FMLA .h (need asimdfp) ==="
          aarch64-linux-gnu-objdump -d build-android/bin/llama-cli | grep -cE 'fmla\s+v[0-9]+\.[0-9]+h' && { echo "FAIL: fp16 arithmetic found"; exit 1; } || echo "PASS: no fp16 arithmetic"

      - name: Package static binaries + libs
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p out-static
          cp build-android/bin/llama-cli build-android/bin/llama-bench out-static/
          for lib in libggml.so libggml-base.so libggml-cpu.so libllama.so; do
            find build-android -name "$lib" -exec cp {} out-static/ \;
          done
          tar -czf llama-android-arm64-sdm670-safe.tar.gz -C out-static .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64-sdm670-safe
          path: llama-android-arm64-sdm670-safe.tar.gz
          retention-days: 30

  sdm670-static-minimal:
    name: SDM670 Static Minimal (llama-cli only, no libs)
    if: github.event.inputs.build_type == 'sdm670-static-minimal'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          submodules: recursive

      - name: Install Android SDK + NDK (manual)
        run: |
          SDK_VERSION=11076708
          ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${SDK_VERSION}_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-30" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Configure CMake (ARMv8.0 baseline)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU_AARCH64=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_KLEIDIAI=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8-a -fno-vectorize -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a -fno-vectorize -O3"

      - name: Build llama-cli only
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cmake --build build-android --config Release --target llama-cli -j$(nproc)

      - name: Verify no illegal instructions
        run: |
          apt-get update -qq && apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null
          aarch64-linux-gnu-objdump -d build-android/bin/llama-cli | grep -cE '\b(sdot|udot|sdotp|udotp|smmla|ummla|usmmla|fmla\s+v[0-9]+\.[0-9]+h)\b' && { echo "FAIL: illegal instructions"; exit 1; } || echo "PASS"

      - name: Upload llama-cli
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-android-arm64-sdm670-safe
          path: build-android/bin/llama-cli
          retention-days: 30